<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Instagram Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

    body { background: #fff; display: flex; justify-content: center; }

    .screen {
      background: #fff;
      width: 390px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 0 24px;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 4px 8px;
      font-size: 15px;
      font-weight: 600;
    }

    .status-icons { display: flex; align-items: center; gap: 6px; }

    .signal { display: flex; align-items: flex-end; gap: 1.5px; }
    .signal span { background: #262626; width: 3px; border-radius: 1px; }

    .battery {
      width: 22px; height: 12px;
      border: 1.5px solid #262626;
      border-radius: 2.5px;
      position: relative;
      display: flex;
      align-items: center;
      padding: 1.5px;
    }
    .battery::after {
      content: '';
      position: absolute;
      right: -4px; top: 50%;
      transform: translateY(-50%);
      width: 2px; height: 5px;
      background: #262626;
      border-radius: 0 1px 1px 0;
    }
    .battery-fill { height: 100%; width: 27%; background: #262626; border-radius: 1px; }

    .back-btn { padding: 10px 0 0; cursor: pointer; }

    .lang-selector {
      text-align: center;
      margin: 8px 0 0;
      color: #262626;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
    }

    .logo-wrap { display: flex; justify-content: center; margin: 60px 0 48px; }

    .ig-logo {
      width: 60px; height: 60px;
      border-radius: 16px;
      background: linear-gradient(135deg, #f9ce34 0%, #f47121 25%, #c13584 50%, #833ab4 75%, #5851db 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .form-area { display: flex; flex-direction: column; gap: 12px; }

    .input-field {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #dbdbdb;
      border-radius: 8px;
      font-size: 14px;
      color: #262626;
      background: #fafafa;
      outline: none;
    }
    .input-field::placeholder { color: #8e8e8e; }
    .input-field:focus { border-color: #a8a8a8; background: #fff; }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: #0095f6;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }
    .login-btn:hover { background: #1877f2; }

    .forgot {
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      font-weight: 600;
      color: #262626;
      cursor: pointer;
    }

    .spacer { flex: 1; }

    .bottom { padding-bottom: 28px; }

    .create-btn {
      width: 100%;
      padding: 13px;
      background: #fff;
      color: #0095f6;
      border: 1.5px solid #0095f6;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .create-btn:hover { background: #e8f4fd; }

    .meta-logo {
      text-align: center;
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #8e8e8e;
      font-size: 13px;
    }

    .home-bar {
      height: 4px;
      width: 120px;
      background: #262626;
      border-radius: 4px;
      margin: 12px auto 0;
    }
  </style>
</head>
<body>
  <div class="screen">

    

    <!-- Back Arrow -->
    <div class="back-btn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M19 12H5M12 5l-7 7 7 7" stroke="#262626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <!-- Language Selector -->
    <div class="lang-selector">
      English (UK)
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
        <path d="M6 9l6 6 6-6" stroke="#262626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <!-- Instagram Logo -->
    <div class="logo-wrap">
      <div class="ig-logo">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none">
          <rect x="2" y="2" width="20" height="20" rx="5.5" stroke="white" stroke-width="2"/>
          <circle cx="12" cy="12" r="4.5" stroke="white" stroke-width="2"/>
          <circle cx="17.5" cy="6.5" r="1" fill="white"/>
        </svg>
      </div>
    </div>

    <!-- Form -->
    <div class="form-area">
      <input class="input-field" type="text" placeholder="Username, email address or mobile number" value="__abh.ay_" />
      <input class="input-field" type="password" placeholder="Password" />
      <button class="login-btn" onclick="openInstagram('nasa')">Log in</button>

<script>
function openInstagram(username) {
  // 1. Define the native app link and the fallback website link
  const appUrl = `instagram://user?username=${username}`;
  const webUrl = `https://instagram.com{username}`;

  // 2. Check if the user is on a mobile device
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

  if (isMobile) {
    // Try opening the native Instagram app
    window.location.href = appUrl;

    // Fallback: If the app isn't installed, open the browser version after 1.5 seconds
    setTimeout(() => {
      window.location.href = webUrl;
    }, 1500);
  } else {
    // If on a desktop/laptop computer, go straight to the website
    window.open(webUrl, '_blank');
  }
}
</script>
    </div>

    <div class="forgot">Forgotten password?</div>

    <div class="spacer"></div>

    <!-- Bottom Buttons -->
    <div class="bottom">
      <button class="create-btn">Create new account</button>
      <div class="meta-logo">
        <!-- Meta wordmark -->
        <svg width="44" height="16" viewBox="0 0 44 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 12.5C2 9.5 3.2 6.8 5 5.1 6.2 4 7.5 3.5 8.8 3.5c.9 0 1.8.3 2.5.9C12.6 5.4 13.8 7.5 13.8 10c0 1.8-.5 3.3-1.4 4.3-.7.8-1.5 1.2-2.4 1.2-.8 0-1.6-.4-2.2-1.2-.5.8-1.2 1.2-2 1.2-.8 0-1.5-.4-2-1.2C3.3 13.4 3 12 3 10.5c0-.6.1-1.2.2-1.7" stroke="#8e8e8e" stroke-width="1.3" stroke-linecap="round"/>
          <path d="M20 4v10M20 4l3.5 4.5L27 4M27 4v10" stroke="#8e8e8e" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M30 4h3c1.7 0 3 1.3 3 3s-1.3 3-3 3h-3V4zM30 10h.5l3.5 4" stroke="#8e8e8e" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M39 9c0-2.5 1.6-4.5 3.6-4.5S46 6.5 46 9s-1.6 4.5-3.6 4.5S39 11.5 39 9z" stroke="#8e8e8e" stroke-width="1.3"/>
        </svg>
        <span>Meta</span>
      </div>
    </div>

    <!-- Home Bar -->
    <div class="home-bar"></div>

  </div>
</body>
</html>
