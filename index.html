<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laila ❤️ Majnu</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Poppins', sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(-45deg,#0f0c29,#302b63,#24243e,#4b134f);
    background-size:400% 400%;
    animation:bg 12s ease infinite;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.card{
    width:90%;
    max-width:700px;
    padding:50px 35px;
    text-align:center;
    color:white;
    border-radius:25px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.2);
    box-shadow:0 0 35px rgba(255,105,180,.25);
    z-index:2;
}

h1{
    font-size:45px;
    color:#ff8fcf;
    margin-bottom:10px;
    text-shadow:0 0 12px rgba(255,105,180,.7);
}

.line{
    font-size:28px;
    line-height:1.7;
    margin:35px 0;
    font-weight:500;
}

.highlight{
    color:#ffd6ec;
    font-size:34px;
    font-weight:bold;
    text-shadow:0 0 15px #ff6fb5;
}

.footer{
    margin-top:25px;
    color:#ddd;
    letter-spacing:3px;
    font-size:14px;
}

.heart{
    position:absolute;
    color:#ff6fae;
    font-size:22px;
    animation:float 8s linear infinite;
    opacity:.8;
}

@keyframes float{
    0%{
        transform:translateY(100vh) scale(.5);
        opacity:0;
    }
    20%{opacity:1;}
    100%{
        transform:translateY(-120px) scale(1.4);
        opacity:0;
    }
}
</style>
</head>
<body>

<div class="card">
    <h1>❤️ Laila Majnu ❤️</h1>

    <div class="line">
        <span class="highlight">"Kya baat hai tumko..."</span>
        <br><br>
        <span class="highlight">"Kya baat hai mujhko..."</span>
    </div>

    <p style="font-size:18px;color:#f1f1f1;">
        Sometimes love doesn't need long conversations,
        just one question that reaches two hearts.
    </p>

    <div class="footer">
        Forever • Laila & Majnu
    </div>
</div>

<!-- Floating Hearts -->
<script>
for(let i=0;i<40;i++){
    const heart=document.createElement("div");
    heart.className="heart";
    heart.innerHTML="❤";
    heart.style.left=Math.random()*100+"vw";
    heart.style.animationDuration=(5+Math.random()*5)+"s";
    heart.style.animationDelay=Math.random()*6+"s";
    heart.style.fontSize=(14+Math.random()*22)+"px";
    document.body.appendChild(heart);
}
</script>

</body>
</html>
